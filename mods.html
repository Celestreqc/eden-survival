<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mods — Eden Survival</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#0b1d26,#02090d);
  color:#e5f7ff;
}
nav{
  position:fixed;
  top:0;
  width:100%;
  background:#02090d;
  box-shadow:0 0 15px rgba(0,229,255,.3);
  z-index:1000;
}
nav ul{
  list-style:none;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
  margin:0;
}
nav a{
  color:#e5f7ff;
  text-decoration:none;
  font-weight:bold;
}
nav a:hover{color:#00e5ff}

main{
  max-width:1200px;
  margin:auto;
  padding:120px 20px 60px;
}

h1{
  text-align:center;
  color:#00e5ff;
  margin-bottom:10px;
}

p{
  text-align:center;
  opacity:.8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:25px;
  margin-top:40px;
}

.mod{
  background:rgba(255,255,255,.05);
  border-radius:14px;
  padding:20px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,229,255,.15);
  transition:transform .3s, box-shadow .3s;
}

.mod:hover{
  transform:translateY(-8px);
  box-shadow:0 0 25px rgba(0,229,255,.4);
}

.mod img{
  width:120px;
  height:auto;
  border-radius:12px;
}
</style>
</head>
