<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inscription — Eden Survival</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
  emailjs.init("PUBLIC_KEY_ICI"); // 🔴 À REMPLACER
})();
</script>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#0b1d26,#02090d);
  color:#e5f7ff;
}
.container{
  max-width:500px;
  margin:100px auto;
  padding:40px;
  background:rgba(255,255,255,0.06);
  border-radius:12px;
  box-shadow:0 0 25px rgba(0,229,255,0.3);
}
h1{
  text-align:center;
  color:#00e5ff;
}
input,select{
  width:100%;
  padding:12px;
  margin:12px 0;
  border-radius:8px;
  border:none;
}
button{
  width:100%;
  padding:14px;
  background:#00e5ff;
  color:#02090d;
  font-weight:bold;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
button:hover{
  background:#7ff6ff;
}
#msg{
  text-align:center;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">
<h1>📝 Inscription Eden Survival</h1>

<form id="inscriptionForm">
  <input type="text" name="pseudo" placeholder="Pseudo en jeu" required>

  <select name="plateforme" required>
    <option value="">Plateforme</option>
    <option>PC</option>
    <option>PlayStation</option>
    <option>Xbox</option>
  </select>

  <input type="email" name="email" placeholder="Adresse email" required>

  <button type="submit">Envoyer l’inscription</button>
</form>

<p id="msg"></p>
</div>

<script>
document.getElementById("inscriptionForm").addEventListener("submit", function(e){
  e.preventDefault();

  emailjs.send("SERVICE_ID_ICI","TEMPLATE_ID_ICI",{
    pseudo: this.pseudo.value,
    plateforme: this.plateforme.value,
    email: this.email.value
  }).then(function(){
    document.getElementById("msg").innerHTML =
      "✅ Inscription envoyée avec succès";
  }, function(){
    document.getElementById("msg").innerHTML =
      "❌ Erreur lors de l’envoi";
  });
});
</script>

</body>
</html>
