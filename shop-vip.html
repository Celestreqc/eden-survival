<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ARK Ascended Shop</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1020;
  color:#e5e7eb;
}
header{
  padding:25px;
  text-align:center;
  background:#020617;
  border-bottom:2px solid #00ffe144;
}
h1{color:#00ffe1;margin:0}
.container{max-width:1400px;margin:auto;padding:20px}
.section{margin-bottom:50px}
.section h2{
  color:#00ffe1;
  border-left:5px solid #00ffe1;
  padding-left:10px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}
.card{
  background:#020617;
  padding:15px;
  border-radius:12px;
  border:1px solid #00ffe133;
}
.price{color:#00ff9d;font-weight:bold}
button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border:none;
  border-radius:8px;
  background:#00ffe1;
  cursor:pointer;
  font-weight:bold;
}
#cart{
  background:#020617;
  padding:15px;
  border-radius:12px;
  border:1px solid #00ffe144;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
}
.total{
  margin-top:10px;
  font-size:18px;
  color:#00ff9d;
}
footer{text-align:center;opacity:.6;padding:20px}
</style>
</head>

<body>

<header>
<h1>🛒 ARK Ascended – Primal Chaos</h1>
<p>1 € = 100 Element</p>
</header>

<div class="container">

<!-- PACKS 1 → 20 -->
<div class="section">
<h2>📦 Packs (1 → 20)</h2>
<div class="grid" id="packsEarly"></div>
</div>

<!-- PACKS 21 → 40 -->
<div class="section">
<h2>🔥 Packs End-Game (21 → 40)</h2>
<div class="grid" id="packsLate"></div>
</div>

<!-- PANIER -->
<div class="section">
<h2>🛒 Panier</h2>
<div id="cart">Panier vide</div>
<div class="total" id="total"></div>

<a href="https://paypal.me/LegacySurvivals" target="_blank">
<button style="background:#ffc439;color:#111">
💳 Payer avec PayPal
</button>
</a>
</div>

</div>

<footer>
Legacy Survival • ARK Ascended
</footer>

<script>
const RATE = 100;
const packsEarly = document.getElementById("packsEarly");
const packsLate  = document.getElementById("packsLate");
const cartDiv    = document.getElementById("cart");
const totalDiv   = document.getElementById("total");

let cart = JSON.parse(localStorage.getItem("cart")) || [];

// Packs 1 → 20 (SANS description)
let htmlEarly = "";
for(let i=1;i<=20;i++){
  let price = 300 + (i * 250);
  htmlEarly += `
    <div class="card">
      <h3>Pack ${i}</h3>
      <p class="price">${price} Element</p>
      <button onclick="addToCart('Pack ${i}',${price})">
        Ajouter
      </button>
    </div>`;
}
packsEarly.innerHTML = htmlEarly;

// Packs 21 → 40
let htmlLate = "";
for(let i=21;i<=40;i++){
  let price = 300 + (i * 350);
  htmlLate += `
    <div class="card">
      <h3>Pack ${i}</h3>
      <p class="price">${price} Element</p>
      <button onclick="addToCart('Pack ${i}',${price})">
        Ajouter
      </button>
    </div>`;
}
packsLate.innerHTML = htmlLate;

function addToCart(name,price){
  cart.push({name,price});
  localStorage.setItem("cart",JSON.stringify(cart));
  renderCart();
}

function renderCart(){
  let total = 0;
  let html = "";
  cart.forEach(item=>{
    total += item.price;
    html += `
      <div class="cart-item">
        <span>${item.name}</span>
        <span>${item.price}</span>
      </div>`;
  });
  cartDiv.innerHTML = html ||
  totalDiv.innerText =
    `Total : ${total} Element ≈ ${(total/RATE).toFixed(2)} €`;
}

renderCart();
</script>

</body>
</html>
