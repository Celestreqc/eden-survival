<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ARK Ascended Shop</title>

<style>
body{
  background:#0b0f1a;
  color:#e6e6e6;
  font-family:Arial,sans-serif;
  margin:0
}
header{
  background:linear-gradient(135deg,#0f172a,#020617);
  padding:25px;
  text-align:center;
  box-shadow:0 0 30px #00ffe155
}
h1{color:#00ffe1}
.lang{position:absolute;top:15px;right:15px}
.lang button{
  background:#020617;
  color:#00ffe1;
  border:1px solid #00ffe155;
  margin-left:5px;
  cursor:pointer
}
.container{max-width:1200px;margin:auto;padding:20px}
.section{margin-bottom:40px}
.section h2{
  border-left:5px solid #00ffe1;
  padding-left:10px;
  color:#00ffe1
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px
}
.card{
  background:#020617;
  padding:15px;
  border-radius:12px;
  box-shadow:0 0 15px #00ffe122;
  transition:.3s
}
.card:hover{transform:scale(1.03)}
.price{color:#00ff9d;font-weight:bold}
button{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:8px;
  background:#00ffe1;
  font-weight:bold;
  cursor:pointer
}
button:hover{background:#00c9b7}
#cart{
  background:#020617;
  border:1px solid #00ffe133;
  padding:15px;
  border-radius:10px
}
.cart-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px
}
.total{margin-top:10px;font-size:18px;color:#00ff9d}
input{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:none;
  margin-top:8px
}
footer{text-align:center;opacity:.6;padding:15px}
</style>
</head>
