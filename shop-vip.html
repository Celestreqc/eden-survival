<script>
const RATE = 100;
let cart = [];
let discount = 0;
let lang = "fr";

// PROMOS (%)
const promos = {
  "ARK10": 10,
  "WELCOME5": 5
};

// ELEMENTS DOM
const cartDiv = document.getElementById("cart");
const totalDiv = document.getElementById("total");
const promoInput = document.getElementById("promoInput");

const title = document.getElementById("title");
const subtitle = document.getElementById("subtitle");
const packsTitle = document.getElementById("packsTitle");
const toolsTitle = document.getElementById("toolsTitle");
const cartTitle = document.getElementById("cartTitle");
const promoLabel = document.getElementById("promoLabel");
const footer = document.getElementById("footer");

function add(name, element){
  cart.push({name,element});
  render();
}

function applyPromo(){
  const code = promoInput.value.toUpperCase();
  if(!promos[code]){
    alert(lang === "fr" ? "Code promo invalide" : "Invalid promo code");
    discount = 0;
  }else{
    discount = promos[code];
    alert(lang === "fr"
      ? `Code appliqué : -${discount}%`
      : `Promo applied: -${discount}%`
    );
  }
  render();
}

function render(){
  let html = "";
  let total = 0;

  cart.forEach(i=>{
    total += i.element;
    html += `
      <div class="cart-item">
        <span>${i.name}</span>
        <span>${i.element} Element</span>
      </div>`;
  });

  if(discount > 0){
    total -= total * (discount / 100);
  }

  cartDiv.innerHTML = html || (lang === "fr" ? "Panier vide" : "Empty cart");

  totalDiv.innerText =
    (lang === "fr" ? "Total : " : "Total: ") +
    Math.round(total) + " Element ≈ " +
    (total / RATE).toFixed(2) + " €";
}

// LANGUES
function setLang(l){
  lang = l;

  if(l === "en"){
    title.innerText = "🛒 ARK Ascended Shop";
    subtitle.innerText = "1 € = 100 Element • Balanced shop";
    packsTitle.innerText = "📦 Element Packs";
    toolsTitle.innerText = "🪓 Tools";
    cartTitle.innerText = "🛒 Cart";
    promoLabel.innerText = "🎟️ Promo code";
    footer.innerText = "Element earnable in game • € optional";
  }else{
    title.innerText = "🛒 Boutique ARK Ascended";
    subtitle.innerText = "1 € = 100 Element • Boutique équilibrée";
    packsTitle.innerText = "📦 Packs Element";
    toolsTitle.innerText = "🪓 Outils";
    cartTitle.innerText = "🛒 Panier";
    promoLabel.innerText = "🎟️ Code promo";
    footer.innerText = "Element gagnable en jeu • € optionnel";
  }

  render();
}
</script>
